name: Instagram daily

on:
  schedule:
    # 10:00 IST = 04:30 UTC, every day.
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate cards only, do not post to Instagram'
        type: boolean
        required: true
        default: true

concurrency:
  group: instagram-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SPREADSHEET_ID: ${{ vars.GOOGLE_SPREADSHEET_ID }}
      GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
      CARDS_PER_POST: ${{ vars.CARDS_PER_POST || '3' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick fonts-noto-core

      - name: Generate job cards
        id: gen
        run: |
          node scripts/generate-job-cards.mjs
          echo "count=$(node -p "JSON.parse(require('fs').readFileSync('public/ig/manifest.json','utf8')).count")" >> "$GITHUB_OUTPUT"

      - name: Commit generated cards
        if: steps.gen.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ig
          git commit -m "chore: instagram job cards $(date -u +%Y-%m-%d)" || echo "no card changes"
          git pull --rebase
          git push

      - name: Dry run - stop before posting
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo "Dry run complete. Review public/ig/*.jpg in the repo, then re-run this workflow with dry_run=false to post."

      - name: Wait for cards to be served over HTTPS
        if: steps.gen.outputs.count != '0' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        run: |
          set -e
          files=$(node -p "JSON.parse(require('fs').readFileSync('public/ig/manifest.json','utf8')).slides.map(s=>s.file).join(' ')")
          for f in $files; do
            url="${IMAGE_BASE_URL%/}/ig/$f"
            ok=""
            for i in $(seq 1 40); do
              if curl -sf -o /dev/null "$url"; then ok=1; break; fi
              sleep 15
            done
            if [ -z "$ok" ]; then echo "Card not served after 10 minutes: $url"; exit 1; fi
            echo "served: $url"
          done

      - name: Post to Instagram
        if: steps.gen.outputs.count != '0' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        run: node scripts/instagram-post.mjs

      - name: Commit posted state
        if: steps.gen.outputs.count != '0' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/instagram-posted.json
          git commit -m "chore: instagram posted state $(date -u +%Y-%m-%d)" || echo "no state changes"
          git pull --rebase
          git push
